# PostgreSQL 16 with pgvector. UNTESTED here (Docker registries were unreachable); the same SQL was tested against
# Ubuntu's postgresql-16 + pgvector 0.6.0.
services:
  db:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: ragtest}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
